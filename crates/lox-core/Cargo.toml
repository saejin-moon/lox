[package]
name = "lox-core"
version = "0.1.0"
edition = "2021"
description = "High-throughput Rust Core for LOX ('Hard Code Nothing')"
authors = ["LOX Authors"]

[lib]
name = "lox_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py311"] }
numpy = "0.22"
smallvec = "1.13"
parking_lot = "0.12"
