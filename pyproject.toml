[project]
name = "corp-nethack"
version = "0.1.0"
description = "Neuro-Symbolic Cognitive Operating System for NetHack NLE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mwparserfromhell>=0.6.6",
    "nle>=1.3.0",
    "pydantic>=2.13.5",
    "requests>=2.31.0",
    "scipy>=1.17.1",
    "xxhash>=3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
