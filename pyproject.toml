[project]
name = "corp-nethack"
version = "0.1.0"
description = "Neuro-Symbolic Cognitive Operating System for NetHack NLE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "gym>=0.21.0,<0.24.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "minihack>=1.0.2",
    "mwparserfromhell>=0.6.6",
    "nevergrad>=1.0.12",
    "nle>=1.3.0",
    "nltk>=3.10.3",
    "numba>=0.67.0",
    "openai>=3.14.1",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyinstrument>=5.1.3",
    "requests>=2.31.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "setuptools<70",
    "toolz>=1.1.0",
    "xxhash>=3.4.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
