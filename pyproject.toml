[project]
name = "lox"
version = "2.0.0"
description = "LOX 2.0: High-Performance Neuro-Symbolic Policy Synthesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "craftax>=1.6.1",
    "duckdb>=1.1.0",
    "google-genai>=2.24.0",
    "gym>=0.21.0,<0.24.0",
    "httpx>=0.28.1",
    "minihack>=1.0.2",
    "nle>=1.3.0",
    "numba>=0.60.0",
    "numpy>=1.26.0",
    "openai>=1.50.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "setuptools<70",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".venv", "build", "dist"]
pythonpath = ["."]
asyncio_mode = "auto"
